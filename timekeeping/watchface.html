<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    .middle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
  </style>
</head>
<body style="background-color: #000000; color: #B3B3B3;">
<div class="middle">
  <span id="meinezeit">Javascript enabled?</span>
</div>

<!-- SunCalc provides the astronomical calculations for the sun's position. -->
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>

<script>

// Initial location used until a newer location is successfully fetched.
let latitude = 51.961563;
let longitude = 7.628202;


// Fetch the latest location from the server.
// If the fetch fails, the previous location is kept.
async function refreshLocation() {
    try {
        const response = await fetch(
            "https://calm-limit-5bf9.vyr6trmgb5.workers.dev/latest"
        );

        if (!response.ok) {
            throw new Error("Could not fetch location");
        }

        const location = await response.json();

        latitude = Number(location.latitude);
        longitude = Number(location.longitude);

    } catch (error) {
        console.error("Location update failed:", error);
    }
}


// Fetch the location once when the page loads,
// then check for a newer location every 5 minutes.
refreshLocation();
setInterval(refreshLocation, 300000);


// These are the solar events that are relevant for the display.
// SunCalc calculates many other events as well, but only these five
// are used here to divide the day into the desired solar phases.
const eventNames = [
    "nadir",
    "sunrise",
    "solarNoon",
    "sunset",
    "dusk"
];


// Convert a time difference in milliseconds into a short
// human-readable duration such as "2h 15m" or "37m".
function formatDuration(milliseconds) {
    const totalMinutes = Math.floor(Math.abs(milliseconds) / 60000);
    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;

    if (hours > 0) return hours + "h " + minutes + "m";

    return minutes + "m";
}


// Calculate the selected solar events for one particular date
// at the current latitude and longitude.
//
// SunCalc returns the actual Date objects for events such as
// sunrise, solar noon, sunset, dusk and nadir.
function getEvents(date) {
    const times = SunCalc.getTimes(date, latitude, longitude);

    // Keep only the solar events listed in eventNames and attach
    // the event name to its calculated time.
    return eventNames.map(name => ({ name: name, time: times[name] }));
}


// Recalculate the current solar phase and update the display.
function updateSunInfo() {

    // The current date and time are used as the reference point
    // for deciding which solar event has already happened
    // and which one will happen next.
    const now = new Date();


    // Calculate the solar events for yesterday, today and tomorrow.
    //
    // Using three days makes sure that there is always a previous
    // and a following solar event available, including around
    // midnight.
    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);

    const today = new Date(now);

    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);


    // Combine all solar events from the three days into one list.
    const events = [
        ...getEvents(yesterday),
        ...getEvents(today),
        ...getEvents(tomorrow)
    ];


    // Put all events into chronological order.
    events.sort((a, b) => a.time - b.time);


    // Find the solar event that has most recently happened
    // and the next solar event that will happen.
    let previousEvent = null;
    let nextEvent = null;


    for (const event of events) {

        // Every event at or before "now" becomes the previous event.
        // Because the list is chronological, the last one assigned
        // here is the most recent event.
        if (event.time <= now) previousEvent = event;

        // The first event after "now" is the next event.
        if (event.time > now) {
            nextEvent = event;
            break;
        }
    }


    // Calculate how much time has passed since the previous
    // solar event and how much time remains until the next one.
    const elapsed = now - previousEvent.time;
    const remaining = nextEvent.time - now;


    // These values determine the appearance and text of the page
    // for the current solar phase.
    let backgroundColor;
    let textColor;
    let timeMessage;


    // After solar midnight (nadir) and before sunrise.
    if (previousEvent.name === "nadir") {

        backgroundColor = "#000000";
        textColor = "#666666";

        timeMessage =
            formatDuration(elapsed) +
            " since solar midnight" +
            "<br>" +
            formatDuration(remaining) +
            " until sunrise";

    // After sunrise and before solar noon.
    } else if (previousEvent.name === "sunrise") {

        backgroundColor = "#87CEEB";
        textColor = "#222222";

        timeMessage =
            formatDuration(elapsed) +
            " since sunrise" +
            "<br>" +
            formatDuration(remaining) +
            " until solar noon";

    // After solar noon and before sunset.
    } else if (previousEvent.name === "solarNoon") {

        backgroundColor = "#4FA3D1";
        textColor = "#FFFFFF";

        timeMessage =
            formatDuration(elapsed) +
            " since solar noon" +
            "<br>" +
            formatDuration(remaining) +
            " until sunset";

    // After sunset and before dusk.
    } else if (previousEvent.name === "sunset") {

        backgroundColor = "#D2691E";
        textColor = "#FFFFFF";

        timeMessage =
            formatDuration(elapsed) +
            " since sunset" +
            "<br>" +
            formatDuration(remaining) +
            " until dusk";

    // After dusk and before the next solar midnight.
    } else if (previousEvent.name === "dusk") {

        backgroundColor = "#191970";
        textColor = "#B3B3B3";

        timeMessage =
            formatDuration(elapsed) +
            " since dusk" +
            "<br>" +
            formatDuration(remaining) +
            " until solar midnight";
    }


    // Apply the colours belonging to the current solar phase.
    document.body.style.backgroundColor = backgroundColor;
    document.body.style.color = textColor;

    // Replace the text in the page with the current solar information.
    document.getElementById("meinezeit").innerHTML = timeMessage;
}


// Calculate and display the solar information immediately
// when the page loads.
updateSunInfo();

// Recalculate the solar information every 60 seconds.
// This runs independently of the location-fetching timer above,
// so a failed /latest request does not stop the clock from updating.
setInterval(updateSunInfo, 60000);

</script>
</body>
</html>
