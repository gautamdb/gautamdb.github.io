<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    .middle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
  </style>
</head>

<body style="background-color: #000000; color: #B3B3B3;">

<div class="middle">
  <span id="meinezeit">Javascript enabled?</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>

<script>

// --------------------------------------------------
// Location
// --------------------------------------------------

// Initial fallback location from the original HTML
let latitude = 51.961563;
let longitude = 7.628202;


// Fetch the latest location from the Worker
async function refreshLocation() {
    try {
        const response = await fetch(
            "https://calm-limit-5bf9.vyr6trmgb5.workers.dev/latest"
        );

        if (!response.ok) {
            throw new Error("Could not fetch location");
        }

        const location = await response.json();

        latitude = Number(location.latitude);
        longitude = Number(location.longitude);

        console.log("Location updated:", latitude, longitude);

    } catch (error) {
        console.error("Location update failed:", error);

        // Keep using the most recently successful coordinates.
    }
}


// Fetch location immediately when the page loads,
// then once every 5 minutes.
refreshLocation();
setInterval(refreshLocation, 5 * 60 * 1000);


// --------------------------------------------------
// Sun / clock
// --------------------------------------------------

const eventNames = [
    "nadir",
    "sunrise",
    "solarNoon",
    "sunset",
    "dusk"
];


function formatDuration(milliseconds) {
    const totalMinutes = Math.floor(Math.abs(milliseconds) / 60000);
    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;

    if (hours > 0) {
        return hours + "h " + minutes + "m";
    }

    return minutes + "m";
}


function getEvents(date) {
    const times = SunCalc.getTimes(date, latitude, longitude);

    return eventNames.map(name => ({
        name: name,
        time: times[name]
    }));
}


function updateSunInfo() {

    const now = new Date();

    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);

    const today = new Date(now);

    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);


    const events = [
        ...getEvents(yesterday),
        ...getEvents(today),
        ...getEvents(tomorrow)
    ];


    events.sort((a, b) => a.time - b.time);


    let previousEvent = null;
    let nextEvent = null;


    for (const event of events) {

        if (event.time <= now) {
            previousEvent = event;
        }

        if (event.time > now) {
            nextEvent = event;
            break;
        }
    }


    const elapsed = now - previousEvent.time;
    const remaining = nextEvent.time - now;


    let backgroundColor;
    let textColor;
    let timeMessage;


    if (previousEvent.name === "nadir") {

        backgroundColor = "#000000";
        textColor = "#666666";

        timeMessage =
            formatDuration(elapsed) +
            " since solar midnight" +
            "<br>" +
            formatDuration(remaining) +
            " until sunrise";

    } else if (previousEvent.name === "sunrise") {

        backgroundColor = "#87CEEB";
        textColor = "#222222";

        timeMessage =
            formatDuration(elapsed) +
            " since sunrise" +
            "<br>" +
            formatDuration(remaining) +
            " until solar noon";

    } else if (previousEvent.name === "solarNoon") {

        backgroundColor = "#4FA3D1";
        textColor = "#FFFFFF";

        timeMessage =
            formatDuration(elapsed) +
            " since solar noon" +
            "<br>" +
            formatDuration(remaining) +
            " until sunset";

    } else if (previousEvent.name === "sunset") {

        backgroundColor = "#D2691E";
        textColor = "#FFFFFF";

        timeMessage =
            formatDuration(elapsed) +
            " since sunset" +
            "<br>" +
            formatDuration(remaining) +
            " until dusk";

    } else if (previousEvent.name === "dusk") {

        backgroundColor = "#191970";
        textColor = "#B3B3B3";

        timeMessage =
            formatDuration(elapsed) +
            " since dusk" +
            "<br>" +
            formatDuration(remaining) +
            " until solar midnight";
    }


    document.body.style.backgroundColor = backgroundColor;
    document.body.style.color = textColor;

    document.getElementById("meinezeit").innerHTML = timeMessage;
}


// Clock updates immediately when the page loads,
// then once every minute.
updateSunInfo();
setInterval(updateSunInfo, 60 * 1000);

</script>

</body>
</html>
