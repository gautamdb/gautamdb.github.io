<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    .middle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
  </style>
</head>

<body style="background-color: #000000; color: #B3B3B3;">

<div class="middle">
  <span id="meinezeit">Javascript enabled?</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>

<script>
const latitude = 51.961563;
const longitude = 7.628202;


// The SunCalc events we want to use.
const eventNames = [
    "nadir",
    "sunrise",
    "solarNoon",
    "sunset",
    "dusk"
];


// Turn a duration in milliseconds into something readable.
function formatDuration(milliseconds) {
    const totalMinutes = Math.floor(Math.abs(milliseconds) / 60000);

    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;

    if (hours > 0) {
        return hours + "h " + minutes + "m";
    }

    return minutes + "m";
}


// Get the events for a particular date.
function getEvents(date) {
    const times = SunCalc.getTimes(
        date,
        latitude,
        longitude
    );

    return eventNames.map(name => ({
        name: name,
        time: times[name]
    }));
}


function updateSunInfo() {

    const now = new Date();

    // Get yesterday, today and tomorrow.
    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);

    const today = new Date(now);

    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);


    // Build one continuous sequence of solar events.
    const events = [
        ...getEvents(yesterday),
        ...getEvents(today),
        ...getEvents(tomorrow)
    ];


    // Sort chronologically.
    events.sort((a, b) => a.time - b.time);


    // Find the event immediately before and after now.
    let previousEvent = null;
    let nextEvent = null;

    for (const event of events) {

        if (event.time <= now) {
            previousEvent = event;
        }

        if (event.time > now) {
            nextEvent = event;
            break;
        }
    }


    // Calculate elapsed and remaining time.
    const elapsed = now - previousEvent.time;
    const remaining = nextEvent.time - now;


    // Set colors and message according to the current solar phase.

    let backgroundColor;
    let textColor;
    let timeMessage;


    if (previousEvent.name === "nadir") {

        // Solar midnight -> sunrise
        backgroundColor = "#000000";
        textColor = "#666666";

        timeMessage =
            formatDuration(elapsed) +
            " since solar midnight" +
            "<br>" +
            formatDuration(remaining) +
            " until sunrise";

    } else if (previousEvent.name === "sunrise") {

        // Sunrise -> solar noon
        backgroundColor = "#87CEEB";
        textColor = "#222222";

        timeMessage =
            formatDuration(elapsed) +
            " since sunrise" +
            "<br>" +
            formatDuration(remaining) +
            " until solar noon";

    } else if (previousEvent.name === "solarNoon") {

        // Solar noon -> sunset
        backgroundColor = "#4FA3D1";
        textColor = "#FFFFFF";

        timeMessage =
            formatDuration(elapsed) +
            " since solar noon" +
            "<br>" +
            formatDuration(remaining) +
            " until sunset";

    } else if (previousEvent.name === "sunset") {

        // Sunset -> dusk
        backgroundColor = "#D2691E";
        textColor = "#FFFFFF";

        timeMessage =
            formatDuration(elapsed) +
            " since sunset" +
            "<br>" +
            formatDuration(remaining) +
            " until dusk";

    } else if (previousEvent.name === "dusk") {

        // Dusk -> solar midnight
        backgroundColor = "#191970";
        textColor = "#B3B3B3";

        timeMessage =
            formatDuration(elapsed) +
            " since dusk" +
            "<br>" +
            formatDuration(remaining) +
            " until solar midnight";
    }


    // Apply the colors.
    document.body.style.backgroundColor = backgroundColor;
    document.body.style.color = textColor;


    // Display the message.
    document.getElementById("meinezeit").innerHTML = timeMessage;
}


// Run immediately.
updateSunInfo();

// Update every minute.
setInterval(updateSunInfo, 60000);
</script>

</body>
</html>
