<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
<h3>Location test</h3>
<div id="location">Loading...</div>
<script>
// Test coordinates.
// These are deliberately remote coordinates in Patagonia.
const latitude = -50;
const longitude = -70;
// Distance threshold in kilometres.
const distanceThreshold = 17;
// GeoNames username.
const geoNamesUsername = "UNAME";
// Ask GeoNames for the nearest accepted populated place.
async function loadLocation() {
    const locationDiv = document.getElementById("location");
    try {
        const placeURL =
            "https://secure.geonames.org/findNearbyJSON" +
            "?lat=" + latitude +
            "&lng=" + longitude +
            "&featureClass=P" +
            "&featureCode=PPL" +
            "&featureCode=PPLA" +
            "&featureCode=PPLA2" +
            "&featureCode=PPLA3" +
            "&featureCode=PPLA4" +
            "&featureCode=PPLA5" +
            "&featureCode=PPLC" +
            "&featureCode=PPLF" +
            "&featureCode=PPLG" +
            "&featureCode=PPLL" +
            "&featureCode=PPLS" +
            "&featureCode=PPLX" +
            "&featureCode%21=PPLCH" +
            "&featureCode%21=PPLH" +
            "&featureCode%21=PPLQ" +
            "&featureCode%21=PPLR" +
            "&featureCode%21=PPLW" +
            "&maxRows=10" +
            "&username=" + geoNamesUsername;
        const placeResponse = await fetch(placeURL);
        if (!placeResponse.ok) {
            throw new Error("Could not fetch place");
        }
        const placeData = await placeResponse.json();
        if (!placeData.geonames || placeData.geonames.length === 0) {
            throw new Error("No populated place found");
        }
        const place = placeData.geonames[0];
        const distance = Number(place.distance);
        const placeName = place.name;
        const geonameId = place.geonameId;
        // Ask GeoNames for the complete hierarchy.
        const hierarchyURL =
            "https://secure.geonames.org/hierarchyJSON" +
            "?geonameId=" + geonameId +
            "&username=" + geoNamesUsername;
        const hierarchyResponse = await fetch(hierarchyURL);
        if (!hierarchyResponse.ok) {
            throw new Error("Could not fetch hierarchy");
        }
        const hierarchyData = await hierarchyResponse.json();
        const names = [];
        if (hierarchyData.geonames) {
            // GeoNames returns the hierarchy from broadest to most specific.
            // Reverse it so the nearest place appears first.
            hierarchyData.geonames
                .filter(function(item) {
                    return item.name && item.name !== "Earth";
                })
                .reverse()
                .forEach(function(item) {
                    const name = item.name;
                    // Remove only immediately repeated identical names.
                    if (names.length === 0 ||
                        names[names.length - 1] !== name) {
                        names.push(name);
                    }
                });
        }
        let html = "";
        if (distance > distanceThreshold) {
            html +=
                Math.round(distance) +
                " km from " +
                placeName +
                "<br><br>";
        }
        names.forEach(function(name) {
            html += name + "<br>";
        });
        locationDiv.innerHTML = html;
        console.log("Nearest place:", placeName);
        console.log("Distance:", distance, "km");
        console.log("GeoNames ID:", geonameId);
        console.log("Hierarchy:", names);
    } catch (error) {
        console.error("Location test failed:", error);
        locationDiv.textContent = "Test failed";
    }
}
loadLocation();
</script>
</body>
</html>
