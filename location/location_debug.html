<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
<h3>Latest location</h3>
<div id="location">Loading...</div>
<br>

<button id="refreshButton" onclick="refreshAll()">Refresh</button>

<div id="status"></div>
<script>
// URL of the Worker endpoint that provides the latest GPS data.
const latestURL =
    "https://calm-limit-5bf9.vyr6trmgb5.workers.dev/latest";
// GeoNames username.
const geoNamesUsername = "gautamdb";
// Distance threshold in kilometres.
const distanceThreshold = 17;
// Format a timestamp using the timezone returned by GeoNames.
function formatTimestamp(timestamp, timeZone) {
    return new Intl.DateTimeFormat("en-GB", {
        day: "numeric",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        timeZone: timeZone
    }).format(new Date(timestamp));
}
// Fetch the latest GPS location and then query GeoNames.
async function refreshAll() {
    const button = document.getElementById("refreshButton");
    const status = document.getElementById("status");
    const locationDiv = document.getElementById("location");
    button.disabled = true;
    button.textContent = "refreshing...";
    status.textContent = "";
    status.style.color = "";
    try {
        // Get the latest location from our Worker.
        const response = await fetch(latestURL);
        if (!response.ok) {
            throw new Error("Could not fetch location");
        }
        const location = await response.json();
        const latitude = Number(location.latitude);
        const longitude = Number(location.longitude);
        // Ask GeoNames for country and timezone.
        const timezoneURL =
            "https://secure.geonames.org/timezoneJSON" +
            "?lat=" + latitude +
            "&lng=" + longitude +
            "&username=" + geoNamesUsername;
        const timezoneResponse = await fetch(timezoneURL);
        if (!timezoneResponse.ok) {
            throw new Error("Could not fetch timezone");
        }
        const timezoneData = await timezoneResponse.json();
        // Ask GeoNames for the nearest accepted populated place.
        const placeURL =
            "https://secure.geonames.org/findNearbyJSON" +
            "?lat=" + latitude +
            "&lng=" + longitude +
            "&featureClass=P" +
            "&featureCode=PPL" +
            "&featureCode=PPLA" +
            "&featureCode=PPLA2" +
            "&featureCode=PPLA3" +
            "&featureCode=PPLA4" +
            "&featureCode=PPLA5" +
            "&featureCode=PPLC" +
            "&featureCode=PPLF" +
            "&featureCode=PPLG" +
            "&featureCode=PPLL" +
            "&featureCode=PPLS" +
            "&featureCode=PPLX" +
            "&featureCode%21=PPLCH" +
            "&featureCode%21=PPLH" +
            "&featureCode%21=PPLQ" +
            "&featureCode%21=PPLR" +
            "&featureCode%21=PPLW" +
            "&maxRows=10" +
            "&username=" + geoNamesUsername;
        const placeResponse = await fetch(placeURL);
        if (!placeResponse.ok) {
            throw new Error("Could not fetch place");
        }
        const placeData = await placeResponse.json();
        if (!placeData.geonames || placeData.geonames.length === 0) {
            throw new Error("No populated place found");
        }
        const place = placeData.geonames[0];
        const distance = Number(place.distance);
        const placeName = place.name;
        const geonameId = place.geonameId;
        // Ask GeoNames for the complete hierarchy of the nearest place.
        const hierarchyURL =
            "https://secure.geonames.org/hierarchyJSON" +
            "?geonameId=" + geonameId +
            "&username=" + geoNamesUsername;
        const hierarchyResponse = await fetch(hierarchyURL);
        if (!hierarchyResponse.ok) {
            throw new Error("Could not fetch hierarchy");
        }
        const hierarchyData = await hierarchyResponse.json();
        const names = [];
        if (hierarchyData.geonames) {
            // GeoNames returns the hierarchy from broadest to most specific.
            // Reverse it so the nearest place appears first.
            hierarchyData.geonames
                .filter(function(item) {
                    return item.name && item.name !== "Earth";
                })
                .reverse()
                .forEach(function(item) {
                    const name = item.name;
                    // Remove only immediately repeated identical names.
                    if (names.length === 0 ||
                        names[names.length - 1] !== name) {
                        names.push(name);
                    }
                });
        }
        const timeZone = timezoneData.timezoneId;
        const countryName = timezoneData.countryName;
        // Create an OpenStreetMap link using the exact coordinates.
        // The coordinates themselves are not displayed on the page.
        const osmURL =
            "https://www.openstreetmap.org/" +
            "?mlat=" + latitude +
            "&mlon=" + longitude +
            "#map=16/" + latitude + "/" + longitude;
        // Build the displayed location information.
        let html = "";
        if (distance > distanceThreshold) {
            html +=
                Math.round(distance) +
                " km from " +
                placeName +
                "<br><br>";
        }
        names.forEach(function(name) {
            html += name + "<br>";
        });
        html +=
            '<a href="' + osmURL + '" target="_blank">' +
            "Show in OpenStreetMap" +
            "</a>";
        html += "<br><br>";
        // Display the timestamps together in a small, unobtrusive line.
        html +=
            '<span style="font-size: 10px;">' +
            "Location recorded: " +
            formatTimestamp(location.gps_timestamp, timeZone) +
            " (" + timeZone + ")" +
            " &middot; " +
            "Received by server: " +
            formatTimestamp(location.received_at, timeZone) +
            " (" + timeZone + ")" +
            "</span>";
        locationDiv.innerHTML = html;
        // Show a temporary success message.
        status.textContent = "Refresh successful";
        status.style.color = "green";
        setTimeout(function() {
            status.textContent = "";
        }, 3000);
    } catch (error) {
        console.error("Location update failed:", error);
        status.textContent = "Refresh failed";
        status.style.color = "red";
    }
    button.disabled = false;
    button.textContent = "Refresh";
}
// Load the location once when the page opens.
refreshAll();
</script>
</body>
</html>
